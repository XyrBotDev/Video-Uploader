name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Links (comma ya newline se separate - multiple allowed)'
        required: true
      caption:
        description: 'Caption (optional - all files pe same lagega)'
        required: false
        default: ''
      filename:
        description: 'Custom filename (optional - single file ke liye)'
        required: false
        default: ''

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg & tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Uploader
        env:
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          LINKS: ${{ github.event.inputs.links }}
          CAPTION: ${{ github.event.inputs.caption }}
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          python uploader.py
