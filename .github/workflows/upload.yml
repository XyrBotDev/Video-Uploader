name: Telegram File Uploader

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Links (comma ya newline se separate - multiple allowed)'
        required: true
      caption:
        description: 'Caption (optional)'
        required: false
        default: ''
      filename:
        description: 'Custom filename (optional)'
        required: false
        default: ''

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install latest yt-dlp nightly
        run: |
          pip install --force-reinstall "yt-dlp[default] @ https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz"

      - name: Run Uploader
        env:
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          LINK: ${{ github.event.inputs.link }}
          CAPTION: ${{ github.event.inputs.caption }}
          FILENAME: ${{ github.event.inputs.filename }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python uploader.py
